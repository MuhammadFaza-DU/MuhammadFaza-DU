<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" fill="none" role="img" aria-labelledby="title desc">
<title id="title">Muhammad Faza — Computer Engineer</title><desc id="desc">Animated emerald circuit board and MF processor. Connecting AI, software, and embedded systems. Initializing system. All systems operational. Welcome to my site.</desc>
<style>
text { font-family: 'Segoe UI', Arial, sans-serif; }
.mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
.flow { stroke-dasharray: 12 210; animation: flow 6s linear infinite; }
.reverse { animation-direction: reverse; }
.pulse { animation: pulse 3s ease-in-out infinite; }
.ring { transform-box: fill-box; transform-origin: center; animation: ring 7s linear infinite; }
.scan { animation: scan 5s ease-in-out infinite; }
.boot { opacity: 0; animation: boot 15s linear infinite; }
.boot-a { opacity: 1; } .boot-b { animation-delay: -10s; } .boot-c { animation-delay: -5s; }
@keyframes flow { to { stroke-dashoffset: -444; } }
@keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
@keyframes ring { to { transform: rotate(360deg); } }
@keyframes scan { 0%,100% { transform: translateY(-36px); opacity: 0; } 20%,80% { opacity: .8; } 50% { transform: translateY(36px); } }
@keyframes boot { 0%,27% { opacity: 1; } 33%,100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) {
 .flow,.pulse,.ring,.scan,.boot { animation: none !important; }
 .flow { stroke-dasharray: none; opacity: .3; } .scan,.boot-b,.boot-c { display: none; } .boot-a { opacity: 1; }
}
</style>
