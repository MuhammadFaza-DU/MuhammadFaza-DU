name: Generate Pac-Man contribution graph

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/pacman/**"
      - ".github/workflows/pacman.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate SVG
        env:
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
        run: python .github/pacman/generate.py --user "${{ github.repository_owner }}" --out dist

      - name: Publish to snake-output branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REMOTE="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          rm -rf /tmp/out
          if git ls-remote --exit-code --heads "$REMOTE" snake-output >/dev/null 2>&1; then
            git clone --depth 1 --branch snake-output "$REMOTE" /tmp/out
          else
            git init /tmp/out
            git -C /tmp/out checkout --orphan snake-output
            git -C /tmp/out remote add origin "$REMOTE"
          fi
          cp dist/*.svg /tmp/out/
          cd /tmp/out
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "Update Pac-Man contribution graph"
          git push origin snake-output
