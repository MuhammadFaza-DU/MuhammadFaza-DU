name: Update contribution Pac-Man

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out the profile renderer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Test the renderer
        run: node --test scripts/contribution-pacman.test.mjs

      - name: Generate light and dark Pac-Man SVGs
        run: node scripts/contribution-pacman.mjs dist

      - name: Upload generated SVGs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: contribution-pacman
          path: |
            dist/contribution-pacman.svg
            dist/contribution-pacman-dark.svg
            dist/contribution-pacman-still.svg
            dist/contribution-pacman-still-dark.svg
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download generated SVGs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: contribution-pacman
          path: dist

      - name: Publish SVGs without rewriting history
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            const fs = require('node:fs/promises');
            const names = [
              'contribution-pacman.svg', 'contribution-pacman-dark.svg',
              'contribution-pacman-still.svg', 'contribution-pacman-still-dark.svg'
            ];
            const files = await fs.readdir('dist');
            if (files.length !== names.length || files.some(name => !names.includes(name))) {
              throw new Error('Unexpected artifact files');
            }
            const contents = [];
            for (const name of names) {
              const file = `dist/${name}`;
              const stat = await fs.lstat(file);
              if (!stat.isFile() || stat.isSymbolicLink() || stat.size > 2_000_000) {
                throw new Error('Invalid artifact file');
              }
              const svg = await fs.readFile(file, 'utf8');
              if (!svg.startsWith('<svg ') || !svg.trimEnd().endsWith('</svg>') ||
                  !svg.includes('prefers-reduced-motion: reduce') ||
                  !svg.includes('id="cell370"') ||
                  (name.includes('-still') && /@keyframes|class="actor"/.test(svg)) ||
                  /<script\b|<foreignObject\b|<!DOCTYPE|<\?|\bon\w+\s*=|\b(?:href|src)\s*=|@import|url\s*\(/i.test(svg)) {
                throw new Error('Invalid generated SVG');
              }
              contents.push(svg);
            }
            const repo = context.repo;
            const branch = 'snake-output';
            let parent;
            let baseTree;
            let existing = [];
            try {
              const ref = await github.rest.git.getRef({ ...repo, ref: `heads/${branch}` });
              parent = ref.data.object.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (parent) {
              const commit = await github.rest.git.getCommit({ ...repo, commit_sha: parent });
              baseTree = commit.data.tree.sha;
              const tree = await github.rest.git.getTree({ ...repo, tree_sha: baseTree });
              existing = tree.data.tree;
            }
            const entries = [];
            for (let i = 0; i < names.length; i++) {
              const blob = await github.rest.git.createBlob({ ...repo, content: contents[i], encoding: 'utf-8' });
              entries.push({ path: names[i], mode: '100644', type: 'blob', sha: blob.data.sha });
            }
            if (parent && entries.every(entry => existing.some(old =>
                old.path === entry.path && old.sha === entry.sha && old.mode === entry.mode))) {
              core.info('Contribution Pac-Man unchanged; no commit needed.');
              return;
            }
            const tree = await github.rest.git.createTree({
              ...repo, ...(baseTree ? { base_tree: baseTree } : {}), tree: entries
            });
            const commit = await github.rest.git.createCommit({
              ...repo, message: 'Update contribution Pac-Man',
              tree: tree.data.sha, parents: parent ? [parent] : []
            });
            if (parent) {
              await github.rest.git.updateRef({
                ...repo, ref: `heads/${branch}`, sha: commit.data.sha, force: false
              });
            } else {
              await github.rest.git.createRef({
                ...repo, ref: `refs/heads/${branch}`, sha: commit.data.sha
              });
            }
