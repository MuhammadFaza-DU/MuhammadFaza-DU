name: Update contribution snake

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Generate light and dark snakes
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b
        with:
          github_user_name: MuhammadFaza-DU
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=%23216e39
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%233fb950

      - name: Respect reduced motion
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            const fs = require('node:fs/promises');
            for (const name of ['github-contribution-grid-snake.svg', 'github-contribution-grid-snake-dark.svg']) {
              const file = `dist/${name}`;
              const svg = await fs.readFile(file, 'utf8');
              if (!svg.includes('</style>')) throw new Error('Generator produced no CSS');
              const reduced = '@media(prefers-reduced-motion:reduce){*{animation:none!important}}';
              await fs.writeFile(file, svg.replace('</style>', `${reduced}</style>`));
            }

      - name: Upload generated SVGs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: contribution-snake
          path: dist/*.svg
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download generated SVGs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: contribution-snake
          path: dist

      - name: Publish SVGs without rewriting history
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            const fs = require('node:fs/promises');
            const names = ['github-contribution-grid-snake.svg', 'github-contribution-grid-snake-dark.svg'];
            const files = await fs.readdir('dist');
            if (files.length !== names.length || files.some(name => !names.includes(name))) {
              throw new Error('Unexpected artifact files');
            }
            const contents = [];
            for (const name of names) {
              const file = `dist/${name}`;
              const stat = await fs.lstat(file);
              if (!stat.isFile() || stat.isSymbolicLink() || stat.size > 2_000_000) {
                throw new Error('Invalid artifact file');
              }
              const svg = await fs.readFile(file, 'utf8');
              if (!svg.startsWith('<svg ') || !svg.trimEnd().endsWith('</svg>') ||
                  !svg.includes('@keyframes') ||
                  /<script\b|<foreignObject\b|<!DOCTYPE|\bon\w+\s*=|\b(?:href|src)\s*=/i.test(svg)) {
                throw new Error('Invalid generated SVG');
              }
              contents.push(svg);
            }
            const repo = context.repo;
            const branch = 'snake-output';
            let parent;
            let baseTree;
            let existing = [];
            try {
              const ref = await github.rest.git.getRef({ ...repo, ref: `heads/${branch}` });
              parent = ref.data.object.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (parent) {
              const commit = await github.rest.git.getCommit({ ...repo, commit_sha: parent });
              baseTree = commit.data.tree.sha;
              const tree = await github.rest.git.getTree({ ...repo, tree_sha: baseTree });
              existing = tree.data.tree;
            }
            const entries = [];
            for (let i = 0; i < names.length; i++) {
              const blob = await github.rest.git.createBlob({ ...repo, content: contents[i], encoding: 'utf-8' });
              entries.push({ path: names[i], mode: '100644', type: 'blob', sha: blob.data.sha });
            }
            if (parent && entries.every(entry => existing.some(old =>
                old.path === entry.path && old.sha === entry.sha && old.mode === entry.mode))) {
              core.info('Contribution snake unchanged; no commit needed.');
              return;
            }
            const tree = await github.rest.git.createTree({
              ...repo, ...(baseTree ? { base_tree: baseTree } : {}), tree: entries
            });
            const commit = await github.rest.git.createCommit({
              ...repo, message: 'Update contribution snake',
              tree: tree.data.sha, parents: parent ? [parent] : []
            });
            if (parent) {
              await github.rest.git.updateRef({
                ...repo, ref: `heads/${branch}`, sha: commit.data.sha, force: false
              });
            } else {
              await github.rest.git.createRef({
                ...repo, ref: `refs/heads/${branch}`, sha: commit.data.sha
              });
            }
